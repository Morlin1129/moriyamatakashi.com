order: 3
badge: "地域の事業者がチャレンジと成長をできるようにする"
plain: "企業誘致や起業支援だけじゃない。成長させたい事業者のための支援を充実させる"
title: "南相馬の会社が、次の一歩を踏み出せるように。"
titleLines:
  - "南相馬の会社が、"
  - "次の一歩を踏み出せるように。"
lead: "昔からの会社も、新しく起業した人も、外から来た企業も。\n5人の会社を30人へ、30人の会社を100人へ。ここで事業を大きくしたい人を支えます。"
policyName: "地場産業も支える、先を見据えた経済政策"
image: { crop: 3, alt: "地域で働く人のイメージ" }
issue:
  - "南相馬では、新産業の育成や企業誘致、起業への支援が行われています。新しい仕事を地域に生むために、こうした取り組みは大切です。同時に、この地域で事業を続けてきた企業や、新たに根づき始めた企業が、次の規模へ成長できる環境も必要だと考えます。"
  - "事業を始めるときと、5人の会社を30人へ、30人の会社を100人へ育てるときでは、直面する課題が違います。仕事を取れても、採用や人材育成が追いつかない。経営者があらゆる判断を抱え、組織の仕組みをつくる時間がない。設備投資や販路開拓への支援だけでは、こうした壁を越えにくいと思います。"
  - "また、企業誘致や補助金の成果は、進出件数や採択件数だけでは測れません。地域でどれだけ雇用が生まれ、地元企業への発注や共同事業、技術や人材の蓄積につながったかまで見ていく必要があります。"
actions:
  - title: "成長の壁を、企業の段階ごとに調べる"
    text: "地元企業や進出後に定着しつつある企業から、採用、育成、資金、販路、組織運営のどこに課題があるかを聞きます。既存の支援制度で対応できていることと、足りないことを明らかにします。"
  - title: "「5人から30人、30人から100人」を目指す企業を支える"
    text: "規模を拡大した経験のある経営者や実務家、金融機関、投資家などと継続して相談できる仕組みを提案します。助言を一度受けて終わりではなく、採用や組織づくりを実行する過程まで支えられる形を考えます。"
  - title: "企業同士が仕事をつくる機会を増やす"
    text: "支援を受けた企業や新たに進出した企業が、地元企業への発注、共同開発、販路の共有などにつながるよう、出会いと協業の場を設けることを提案します。"
  - title: "地域に残る成果を確かめる"
    text: "支援策や企業誘致について、雇用者数だけでなく、地元への発注、企業間の協業、事業の継続状況などを追います。結果を見て、次の支援の内容を改善するよう働きかけます。"
checks:
  - "採用、育成、資金、販路、組織運営のどこに壁があるか（企業の段階ごとに）"
  - "今ある支援制度で対応できていること、足りないこと"
  - "企業誘致や補助金が、地元への発注や協業、雇用につながったか"
  - "支援を受けた事業が、その後も続いているか"
goalHeading: "目指す地域の姿"
goal:
  - "南相馬で事業を始める人だけでなく、ここで事業を大きくしたい人にも、次の一歩を踏み出せる道がある地域です。企業が成長する過程で、働く人が育ち、地元企業との新しい仕事が生まれる。外から来た企業の力も地域の力と結びつき、互いの成長につながることを目指します。"
  - "その積み重ねによって、地域の人が働きたいと思える仕事や、将来を託せる企業を増やしていきたいです。"
resources:
  - title: "企業立地助成制度"
    url: "https://www.city.minamisoma.lg.jp/portal/sections/16/1620/16202/7/1462.html"
    note: "今ある支援を棚卸しするための資料です。"
  - title: "事業者向け支援一覧"
    url: "https://www.city.minamisoma.lg.jp/portal/service/subsidies/2/2/index.html"
    note: "「5人から30人、30人から100人」の段階で足りない支援は、公開資料だけで断定せず、経営者への聞き取りで確かめます。"
