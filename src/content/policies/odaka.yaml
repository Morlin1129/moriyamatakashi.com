    note: "当時の調査でスーパーを必要と答えた割合と、商業の充実を求める声が載っています。当時の対象者への調査なので、現在の需要を表す数字としてそのまま使わず、再調査の必要性につなげます。"
  - title: "南相馬市地域公共交通計画"
    url: "https://www.city.minamisoma.lg.jp/portal/sections/13/1320/13201/1_1/31207.html"
    note: "移動に関する現行施策を調べる入口です。"
