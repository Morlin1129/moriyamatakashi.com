order: 4
badge: "声が事業に届く地域づくりができるようにする"
plain: "意見の集め方や反映のさせ方の課題を見つける。小高や鹿島でも地域の声がちゃんと事業に届くようにする"
title: "小高と鹿島の暮らしを、地域の声で。"
titleLines:
  - "小高と鹿島の暮らしを、"
  - "地域の声で。"
lead: "要望を聞く場はあっても、多くの人が感じていることが事業の中身に届いているとは限りません。\n小高と鹿島で、地域の声が決め方と中身に反映される形をつくります。"
policyName: "小高・鹿島の地域課題に、住民の実感が反映される仕組みをつくる"
image: { src: "/assets/policies/odaka-kashima.webp", alt: "地域の人が集まって話し合う様子" }
issue:
  - "小高も鹿島も、市の中心部から離れ、暮らしや地域づくりの課題を抱えています。意見交換会やパブリックコメントなど、要望を聞く場は用意されています。それでも、そこで出た声が事業の中身にどう反映されたのかが分からない。一部の目立つ意見や、行政側の当初の案がそのまま進んでいるように見える。そう感じている住民の声を、両地区で聞いてきました。"
  - "小高では、買い物、医療、移動といった日々の暮らしの課題が長く残っています。スーパーや、食品・日用品をまとめて買える場を望む声は以前から多い一方、人口規模から難しいと説明されてきました。計画をつくり、要望を聞いても、それが暮らしの実感に合う事業になり、実施後に不便が減ったかまで確かめられているとは言えません。何を、いつ、どこで使えれば暮らしやすくなるのか。過去の調査で示された課題のうち、何がまだ残っているのか。そこから考え直す必要があると思っています。"
  - "鹿島では、駅舎の改修と、サービスエリア周辺の大規模な開発という大きな事業が進んでいます。私は、どちらの事業にも反対ではありません。ただ、何がどう決まってきたのか、地域の暮らしにとってどんな意味があるのかが、住民に十分に共有されているとは感じにくい、という声を聞いています。鹿島は小高に比べて移住者や若い担い手が少ない地域です。それでも、地域への思いを持つ人は多くいます。その人たちが事業に関わり、鹿島らしさをつくっていける場を用意することが、大きな事業を地域の財産にするために必要だと考えています。"
actions:
  - title: "声の集め方を、日常の場に広げる"
    text: "意見交換会やアンケートに来る人だけでなく、商店、集会所、学校や子育ての場など、日常の場で困りごとや希望を聞く仕組みを提案します。言葉になっていない不便や、少数の人が抱える大切な意見も拾えるようにします。"
  - title: "決め方を、見えるようにする"
    text: "何を採り入れ、何を採り入れなかったのか。その理由と、費用や運営の見通しを、事業の節目ごとに分かる形で示すよう働きかけます。鹿島の駅舎やサービスエリア周辺開発のように大きな事業ほど、途中で地域の声を反映できる機会を確保することが大切だと考えています。"
  - title: "地域ごとの拠点と特色を、住民と事業者でつくる"
    text: "小高では、買い物の場を地域の拠点として育てる方法を、市民と事業者が一緒に考えます。既存店の充実や配達、市民と事業者による共同の運営など、複数の方法を比べます。鹿島では、駅舎や既存の団体・行事を軸に、地域の人が関わり続けられる仕組みを事業の中に組み込むよう提案します。"
  - title: "小さく試して、結果を伝える"
    text: "最初から大きな形を決めず、チャレンジショップや配達、試験的な催しなどから、需要と担い手を確かめます。試した結果を地域に伝え、声を聞き直して次につなげる進め方を、両地区で当たり前にしていきたいです。"
checks:
  - "小高で、買い物・医療・移動について今も残っている困りごと"
  - "鹿島の駅舎とサービスエリア周辺開発で、地域の声がどこまで反映されたかと、その説明の状況"
  - "両地区で、地域づくりに関わりたい人や団体と、その受け皿"
  - "過去の調査や計画で示された課題のうち、まだ残っているもの"
goalHeading: "目指す小高と鹿島の姿"
goal:
  - "「人口が少ないから」「もう決まったから」で話が終わるのではなく、どうすれば暮らしが良くなるかを地域で考え、事業の中身に反映できる小高と鹿島です。"
  - "小高では日常の課題を一つずつ改善し、鹿島では大きな事業を地域の財産に育てる。どちらも、住民の声が事業の細部まで届き、地域の人や団体が担い手になる。その積み重ねで、ここで暮らし続けたいと思える日常をつくっていきたいです。"
