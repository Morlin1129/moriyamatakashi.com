order: 2
badge: "小高の買い物・医療・交通"
plain: "小高の買い物・病院・移動を、今より楽にする"
title: "小高の暮らしの不便を、一つずつ。"
titleLines:
  - "小高の暮らしの不便を、"
  - "一つずつ。"
lead: "何を、いつ、どこで利用できれば暮らしやすくなるか。\n日々の困りごとから、実現方法を考えます。"
policyName: "小高の生活利便性を、実感できる形で高める"
image: { crop: 1, alt: "商店街のイメージ" }
issue:
  - "小高では、買い物、医療、移動など、日々の暮らしに関わる課題が残っています。市民の要望を聞いたり計画をつくったりしても、それが暮らしの実感に合う事業になっているか、実施後に不便が減ったかまで確かめる必要があります。"
  - "特に買い物の利便性は、長年にわたって求められてきました。ドラッグストアや、食品・日用品をまとめて買える施設を望む声がある一方、人口規模から難しいと説明されてきました。近隣の町で商業施設の整備が進むなか、小高では実現の可能性を十分に探ってもらえていない、と感じる市民もいます。"
  - "もちろん、要望の通りに大きな施設を建てれば解決する、という話ではありません。何を、いつ、どの程度買えるようになれば暮らしが改善するのか。車を使えない人にはどう届けるのか。既存の商店とどう力を合わせるのか。そうした中身を市民や事業者と詰め、複数の方法を比べることが大切です。過去の調査や計画も振り返り、示された課題が現在の事業にどう反映され、何がまだ残っているのかを明らかにしたいです。"
actions:
  - title: "困りごとを具体的に調べる"
    text: "買い物、医療、移動について、市民がどんな場面で、何に困っているかを具体的に調べます。買い物なら品ぞろえや営業時間、医療なら受診するまでの負担、移動なら行き先や時間帯まで見ます。要望を聞くだけでなく、何が改善すれば暮らしやすくなるかを確かめます。"
  - title: "地域と事業者で、実現方法を考える"
    text: "市民、地域団体、既存の事業者、新たに参画したい企業、行政が、実現方法を一緒に考える場をつくるよう働きかけます。行政内部だけで実施しやすい規模にまとめるのではなく、民間の事業や地域の力も含めて、実行できる方法を探ります。"
  - title: "買い物の場を、地域の拠点に育てる"
    text: "既存店の充実や配達に加え、市民と事業者が共同で運営主体をつくる方法も検討したいです。食品・日用品の販売に、飲食や交流、福祉などの機能を組み合わせれば、買い物の場を地域の拠点として育てられるかもしれません。その際には、誰が出資・運営し、商業で担う部分と行政が関わる部分をどう分けるか、継続的な収支をどう成り立たせるかまで考えます。"
  - title: "小さく試して、続けられる形へ"
    text: "最初から大きな施設を決めるのではなく、既存の事業者も参加できるチャレンジショップや配達などから需要、採算、担い手を確かめます。小さな実証の結果を次の事業につなぎ、複合的な拠点に進めるかを判断します。医療や移動についても、当事者と実施する人たちが一緒に方法を考え、試した結果を見て改善する進め方を広げたいです。"
checks:
  - "必要な品ぞろえと、買い物ができる時間帯"
  - "車を使えない人の、病院や買い物への移動"
  - "担い手と、続けられる収支"
  - "過去の調査や計画で示された課題のうち、まだ残っているもの"
goalHeading: "目指す小高の姿"
goal:
  - "「人口が少ないから難しい」で話が終わるのではなく、どの水準なら暮らしの不便が減り、どんな組み合わせなら実現できるかを地域で考え、行動に移せる小高です。"
  - "買い物をはじめとする日常の課題を一つずつ改善するとともに、市民の声が事業の細部まで届き、地域の事業者や団体が解決の担い手になる。その積み重ねによって、小高で暮らし続けたいと思える日常をつくっていきたいです。"
resources:
