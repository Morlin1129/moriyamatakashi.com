order: 1
badge: "職員が成長・活躍できる市役所にする"
plain: "市役所の人が働きやすくなれば、サービスも良くなる。職員が活躍できる市役所が、すべての土台。"
title: "職員が活躍できる市役所が、すべての土台。"
titleLines:
  - "職員が活躍できる市役所が、"
  - "すべての土台。"
lead: "声を聞き、事実を確かめ、事業をつくり、改善し続ける。その仕事を担うのは市役所の職員です。\n職員がデータを見て議論し、企画のノウハウを受け継げる環境をつくることが、いちばん大切なしくみづくりだと考えています。"
policyName: "職員が力を発揮できる市役所へ"
image: { crop: 0, alt: "市役所の仕事のイメージ" }
issue:
  - "<a href=\"/vision/\">考え方</a>で書いたとおり、住民の声を改善につなげるには、困りごとをつかむ、事業をつくって改善し続ける、関わる人の合意をつくる、という難しい仕事があります。それを日々担っているのが市役所の職員です。職員はいまも住民と向き合ってくれています。ただ、震災後の15年は目の前の仕事をこなすことで精いっぱいで、データを見て議論したり、企画立案のノウハウを上の世代から受け継いだりする時間が取れなかったのではないか、と私は考えています。だから私は、職員が力を発揮できる環境をつくることを、最初の、そして最も重要な取り組みに置いています。"
  - "市役所には、日々の手続きや調整に加え、住民の要望への対応、新しい事業の企画、既存事業の運営など、多くの仕事があります。一方で、業務量や仕事の進め方が十分に見直されないままでは、経験のある職員に負担が集中し、若手を育てる時間や、事業の成果を振り返る時間を確保しにくくなります。"
  - "古いIT環境や煩雑な事務作業も、改善に使える時間を奪います。市長、議員、市民から寄せられる意見を調整するなかで、職員が目の前の仕事をこなすだけで精いっぱいになっていないか、実態を確かめる必要があります。"
actions:
  - title: "仕事の実態を把握する"
    text: "サービス残業を含む労働時間や、業務ごとの作業量を調べるよう働きかけます。職員の声も聞き、負担が集中している仕事、重複している仕事、やめられる仕事を明らかにします。"
  - title: "日々の仕事を改善する"
    text: "業務の進め方や人員配置を見直すとともに、メール、情報共有、議事録作成など、身近なIT環境の改善を提案します。職員自身が不便を見つけ、改善を試せるようにします。"
  - title: "経験を組織の力に変える"
    text: "企画時に確認すべきことをまとめたひな形や、事業を進める際の手順、過去の判断と改善の記録を共有する仕組みを提案します。AIも、職員の作業を助け、知識を活用しやすくするために使います。"
  - title: "意見の橋渡しをする"
    text: "市民の要望をそのまま職員に負わせるのではなく、何に困っているのか、何を優先すべきかを一緒に整理します。住民、行政、議会の間で実現方法を探ります。"
checks:
  - "サービス残業を含む労働時間と、業務ごとの作業量"
  - "負担が集中している仕事、重複している仕事、やめられる仕事"
  - "メールや情報共有、議事録作成など、身近なIT環境の不便"
  - "企画のひな形や、過去の判断・改善の記録が共有されているか"
goalHeading: "目指す市役所の姿"
goal:
  - "職員が日々の処理に追われるだけでなく、住民の声を聞き、課題を調べ、事業を改善する時間を持てる市役所です。"
  - "経験のある職員の知識が若手にも伝わり、担当者が替わっても仕事の質を保てる。現場で気づいた小さな不便を職員自身が提案し、改善できる。そうした環境が、住民に届く行政サービスにつながると考えます。"
resources:
  - title: "南相馬市DX推進ビジョン"
    url: "https://www.city.minamisoma.lg.jp/portal/admin/keikaku_torikumi/9/22652.html"
    note: "職員が本来の業務に注力する考え方の出発点です。市は窓口受付時間を試行的に変え、政策立案や必要な市民サービスへ労力を移す取り組みも始めています。現状を「何もしていない」とせず、効果を確かめて広げる提案につなげます。"
